[tool.poetry]
name = "rate-limiter"
version = "0.1.0"
description = "Redis backed FastAPI rate limiter"
authors = ["Your Name <your@email.com>"]
readme = "README.md"
packages = [
    { include = "rate_limiter", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
redis = "^6.0"
pydantic-settings = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.0"
httpx = "^0.28"
testcontainers = "^4.0"
ruff = "^0.15.21"
mypy = "^2.3.0"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"


[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true